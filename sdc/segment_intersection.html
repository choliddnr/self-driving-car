<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segment Intersection</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <canvas id="myCanvas"></canvas>
    <script>
        myCanvas.width = window.innerWidth;
        myCanvas.height = window.innerHeight;
        const ctx = myCanvas.getContext("2d");

        const mouse = { x: 0, y: 0 }
        let angle = 0;

        const A = { x: 200, y: 150 };
        const B = { x: 150, y: 250 };
        const C = { x: 50, y: 100 };
        const D = { x: 250, y: 200 };


        function drawDot(point, label, color = "white") {
            ctx.beginPath();
            ctx.arc(point.x, point.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "black";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "bold 14px Arial";
            ctx.fillText(label, point.x, point.y)
        }

        function lerp(A, B, t) {
            return A + (B - A) * t;
        }


        function drawLine(A, B, label_A, label_B) {
            ctx.beginPath();
            ctx.moveTo(A.x, A.y);
            ctx.lineTo(B.x, B.y);
            ctx.stroke()
            drawDot(A, label_A);
            drawDot(B, label_B);
        }

        function getIntersection(A, B, C, D) {
            /*
            Ix = Ax+(Bx-Ax)t = Cx+(Dx-Cx)u ->(equ1)
            Iy = Ay+(By-Ay)t = Cy+(Dy-Cy)u ->(equ2)

            Ax+(Bx-Ax)t = Cx+(Dx-Cx)u | -Cx
            (Ax-Cx)+(Bx-Ax)t = (Dx-Cx)u ->(equ3) // don't devide with Dx-Cx because they could return 0

            Ay+(By-Ay)t = Cy+(Dy-Cy)u | -Cy
            (Ay-Cy)+(By-Ay)t = (Dy-Cy)u | *(Dx-Cx)
            (Dx-Cx)(Ay-Cy)+(Dx-Cx)(By-Ay)t = (Dy-Cy)(Dx-Cx)u | (Dx-Cx)u = (Ax-Cx)+(Bx-Ax)t => (equ3)
            (Dx-Cx)(Ay-Cy)+(Dx-Cx)(By-Ay)t = (Dy-Cy)((Ax-Cx)+(Bx-Ax)t) 
            (Dx-Cx)(Ay-Cy)+(Dx-Cx)(By-Ay)t = (Dy-Cy)(Ax-Cx)+(Dy-Cy)(Bx-Ax)t | -(Dy-Cy)(Ax-Cx)
                                                                            |  -(Dy-Cy)(Bx-Ax)t
            (Dx-Cx)(Ay-Cy)-(Dy-Cy)(Ax-Cx)+(Dx-Cx)(By-Ay)t = (Dy-Cy)(Bx-Ax)t
            (Dx-Cx)(Ay-Cy)-(Dy-Cy)(Ax-Cx) = (Dy-Cy)(Bx-Ax)t-(Dx-Cx)(By-Ay)t

            t= (Dx-Cx)(Ay-Cy)-(Dy-Cy)(Ax-Cx) / (Dy-Cy)(Bx-Ax)-(Dx-Cx)(By-Ay)
            tTop = (Dx-Cx)(Ay-Cy)-(Dy-Cy)(Ax-Cx)
            tBottom = (Dy-Cy)(Bx-Ax)-(Dx-Cx)(By-Ay)
            t = tTop/tBottom // we need to make sure that bottom is not 0

            Cx+(Dx-Cx)u = Ax+(Bx-Ax)t | -Ax
            (Cx-Ax)+(Dx-Cx)u = (Bx-Ax)t -> (equ4)

            Cy+(Dy-Cy)u = Ay+(By-Ay)t | -Ay
            (Cy-Ay)+(Dy-Cy)u = (By-Ay)t | *(Bx-Ax)
            (Cy-Ay)(Bx-Ax)+(Bx-Ax)(Dy-Cy)u = (By-Ay)(Bx-Ax)t
            (Cy-Ay)(Bx-Ax)+(Bx-Ax)(Dy-Cy)u = (By-Ay)((Cx-Ax)+(Dx-Cx)u)
            (Cy-Ay)(Bx-Ax)+(Bx-Ax)(Dy-Cy)u = (By-Ay)(Cx-Ax)+(By-Ay)(Dx-Cx)u 
            (Cy-Ay)(Bx-Ax)-(By-Ay)(Cx-Ax) = (By-Ay)(Dx-Cx)u - (Bx-Ax)(Dy-Cy)u
            (Cy-Ay)(Bx-Ax)-(By-Ay)(Cx-Ax) = ((By-Ay)(Dx-Cx)- (Bx-Ax)(Dy-Cy))u

            u =  (Cy-Ay)(Bx-Ax)-(By-Ay)(Cx-Ax) / (By-Ay)(Dx-Cx)-(Bx-Ax)(Dy-Cy)
            uTop = (Cy-Ay)(Bx-Ax)-(By-Ay)(Cx-Ax)


            */
            const tTop = (D.x - C.x) * (A.y - C.y) - (D.y - C.y) * (A.x - C.x)
            const tBottom = (D.y - C.y) * (B.x - A.x) - (D.x - C.x) * (B.y - A.y)

            const uTop = (C.y - A.y) * (B.x - A.x) - (B.y - A.y) * (C.x - A.x)
            const uBottom = (D.x - C.x) * (B.y - A.y) - (D.y - C.y) * (B.x - A.x)

            // make sure that bottom doesn't return 0 or the system will be break
            // to prevent system break, return null if bottom is 0,
            // 
            if (tBottom != 0) {
                const t = tTop / tBottom;
                const u = uTop / uBottom;
                // console.log(t, u)
                if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
                    return {
                        x: lerp(A.x, B.x, t),
                        y: lerp(A.y, B.y, t),
                        bottom: tBottom
                    }
                }
            }

        }

        function animate() {
            myCanvas.height = window.innerHeight;
            update()
            requestAnimationFrame(animate);
        }
        function update() {
            const radius = 100;
            A.x = mouse.x + Math.cos(angle) * radius;
            A.y = mouse.y - Math.sin(angle) * radius;
            B.x = mouse.x - Math.cos(angle) * radius;
            B.y = mouse.y + Math.sin(angle) * radius;
            angle += 0.002
            drawLine(A, B, "A", "B");
            drawLine(C, D, "C", "D");
            let I = getIntersection(A, B, C, D);
            if (I) {
                drawDot(I, "I", "green");
                // console.log(I.bottom)

                ctx.beginPath();
                ctx.rect(myCanvas.width / 2, 0, I.tBottom / 200, 20);
                ctx.fill();
            }

        }

        document.onmousemove = (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        }

        animate()

    </script>
</body>

</html>
